<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Welcome to BiteChain</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="static/css/style.css"><style>body{display:flex;justify-content:center;align-items:center;height:100vh}.login-container{text-align:center;padding:40px;background:var(--card-bg);border-radius:16px;box-shadow:0 8px 30px var(--shadow-color)}.login-container h1{font-size:3rem;color:var(--primary-color);margin-bottom:20px}.login-form input{display:block;width:300px;padding:15px;margin-bottom:15px;border-radius:10px;border:2px solid var(--border-color);font-family:'Oswald',sans-serif;font-size:1rem;background-color:var(--bg-color);color:var(--text-color)}.login-form button{width:100%;padding:15px;border-radius:10px;border:none;background:var(--primary-color);color:white;font-family:'Oswald',sans-serif;font-size:1.1rem;text-transform:uppercase;cursor:pointer;transition:background .2s}.login-form button:hover{background:var(--primary-hover)}</style></head><body><script>const savedTheme=localStorage.getItem('bitechain_theme')||'light-theme';document.documentElement.className=savedTheme;</script><div class="login-container"><h1>BiteChain</h1><form id="login-form" class="login-form"><input type="text" id="username" placeholder="Enter Your Username" required><input type="password" id="password" placeholder="Password (for demo)"><button type="submit">Find Restaurants</button></form></div><script>document.getElementById('login-form').addEventListener('submit',function(e){e.preventDefault();const username=document.getElementById('username').value;localStorage.setItem('bitechain_username',username);localStorage.setItem('bitechain_location','Chennai');window.location.href='index.html'});</script></body></html>
